name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Calling test.yml rather than duplicating its matrix: a copied matrix drifts
  # from the PR gate silently, and the drift stays invisible until a release
  # ships something the PR gate would have caught. pypi-publish already needs
  # release-build, so the whole chain inherits this.
  #
  # Nothing to do at release time. But note the failure mode this introduces:
  # GitHub creates the release object before this workflow runs, so a failing
  # leg leaves the release published with nothing on PyPI. If that ever happens,
  # fix the cause and re-run the failed jobs:
  #   gh run list --workflow publish.yml     # the run will show as failed
  #   gh run rerun <run-id> --failed
  test:
    uses: ./.github/workflows/test.yml

  release-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/kimon-gedgraph

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
