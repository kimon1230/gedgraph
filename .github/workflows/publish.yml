name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Calling test.yml rather than duplicating its matrix: a copied matrix drifts
  # from the PR gate silently, and the drift stays invisible until a release
  # ships something the PR gate would have caught. pypi-publish already needs
  # release-build, so the whole chain inherits this.
  #
  # Nothing to do at release time. But note the failure mode this introduces:
  # GitHub creates the release object before this workflow runs, so a failing
  # leg leaves the release published with nothing on PyPI. If that ever happens,
  # fix the cause and re-run the failed jobs:
  #   gh run list --workflow publish.yml     # the run will show as failed
  #   gh run rerun <run-id> --failed
  test:
    uses: ./.github/workflows/test.yml

  release-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install 'build>=1.0.0,<2'
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/kimon-gedgraph

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
